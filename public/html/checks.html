<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daily Checks</title>
        <link rel="stylesheet" href="/css/navigation.css" />
        <link rel="stylesheet" href="/css/checks.css" />
    </head>
    <body>
        <main class="checks-page">
            <a
                class="back-link"
                href="/index.html"
                aria-label="Back to dashboard"
            >
                <span aria-hidden="true">←</span> Dashboard
            </a>

            <section class="checks-shell">
                <header class="checks-header">
                    <div>
                        <h1>Checks</h1>
                        <p>Where the store keeper and the manager disagree</p>
                    </div>
                    <span class="open-count" id="open-count">Open · 0</span>
                </header>

                <div class="checks-list" id="checks-list" aria-live="polite">
                    <p class="loading-message">Loading checks…</p>
                </div>
            </section>
        </main>
        <script src="/js/navigation.js"></script>
        <script src="/js/checks.js"></script>
    </body>
</html>
