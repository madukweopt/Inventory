<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Somad Agro-oil Processing Limited</title>
        <link rel="stylesheet" href="/css/landing.css" />
        <link rel="stylesheet" href="/css/theme.css" />
            <!-- Installable app: name, icon and colour, and the home-screen icon. -->
        <link rel="manifest" href="/manifest.webmanifest" /><meta name="theme-color" content="#08653e" /><link rel="icon" type="image/png" href="/images/app/favicon-48.png" /><link rel="apple-touch-icon" href="/images/app/apple-touch-icon.png" />
    </head>
    <body>
        <main class="portal">
            <img
                class="portal-logo"
                src="/images/logo.png"
                alt="Somad Agro-oil Processing Limited logo"
            />
            <h1 class="portal-name">Somad Agro-oil Processing Limited</h1>
            <p class="portal-subtitle">Staff Portal</p>
            <form id="login-form" method="post" action="/api/login">
                <label for="login-username">Username</label><input type="text" id="login-username" name="username" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
                <label for="login-password">Password</label><input
                    type="password"
                    id="login-password" name="password"
                    placeholder="Enter your password" autocomplete="current-password" required
                />
                <button type="submit">Login</button>
            </form>
        </main>
		<script src="/js/ui.js"></script>
        <script src="/js/debug-tools.js"></script>
        <script src="/js/login.js"></script>
    </body>
</html>
